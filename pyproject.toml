[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Schema-constrained function calling with Qwen3-0.6B"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.0,<3",
    "pydantic>=2.0,<3",
]

[dependency-groups]
dev = ["flake8>=7,<8", "mypy>=1.15,<3"]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/llm_sdk"
exclude = ["^\\.venv/", "^llm_sdk/"]

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
follow_imports = "skip"
